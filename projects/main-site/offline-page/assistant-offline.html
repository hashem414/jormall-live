<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JorMall Assistant — Offline</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#18304b 0,#07111d 48%,#03070d 100%);font-family:Inter,Segoe UI,Arial,sans-serif;color:#f7fafc;padding:24px}.card{width:min(620px,100%);padding:46px 38px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(9,20,33,.84);box-shadow:0 28px 80px rgba(0,0,0,.42);text-align:center}.status{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border-radius:999px;background:rgba(248,113,113,.12);color:#fca5a5;font-weight:700;letter-spacing:.04em}.dot{width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 16px #ef4444}h1{margin:24px 0 12px;font-size:clamp(30px,6vw,48px)}p{margin:8px auto;color:#b8c5d3;font-size:17px;line-height:1.7;max-width:500px}.ar{direction:rtl;font-family:Tahoma,Segoe UI,Arial,sans-serif;color:#e6edf5}.brand{margin-top:28px;color:#6f8297;font-size:13px;letter-spacing:.08em;text-transform:uppercase}</style>
</head>
<body>
  <main class="card">
    <div class="status"><span class="dot"></span> Offline</div>
    <h1>JorMall Assistant</h1>
    <p>The assistant is currently offline and can be restored by an administrator from Deployer.</p>
    <p class="ar">المساعد متوقف حاليًا، ويمكن للمدير تشغيله مرة أخرى من لوحة النشر.</p>
    <div class="brand">JorMall AI &amp; Innovation Division</div>
  </main>
</body>
</html>
