name: interactive-sms-side-test

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-client_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-client_chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /var/lib/jormall/apps/interactive-sms-side-test/db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-client_chatbot} -d ${POSTGRES_DB:-client_chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 192m
    memswap_limit: 256m
    cpus: 0.50
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /etc/jormall/apps/interactive-sms-side-test/app.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_BASE_PATH: /interactive-sms
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-client_chatbot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-client_chatbot}
      PUBLIC_CHATBOT_BASE_URL: https://interactive-sms-test.jormallapp.com/interactive-sms
      ALLOWED_ORIGINS: https://interactive-sms-test.jormallapp.com
    ports:
      - "127.0.0.1:18029:8000"
    volumes:
      - /var/lib/jormall/apps/interactive-sms-side-test/conversations:/app/data/conversations
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 8
      start_period: 30s
    mem_limit: 320m
    memswap_limit: 384m
    cpus: 0.75
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
