name: central-ecommerce-production-local

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jormall_chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-jormall_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-REDACTED_CONFIGURE_LOCALLY}
    volumes:
      - production_local_db:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          psql -U ${POSTGRES_USER:-jormall_user} -d ${POSTGRES_DB:-jormall_chatbot}
          -c 'CREATE EXTENSION IF NOT EXISTS vector' >/dev/null &&
          pg_isready -U ${POSTGRES_USER:-jormall_user} -d ${POSTGRES_DB:-jormall_chatbot}
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-jormall_user}:${POSTGRES_PASSWORD:-REDACTED_CONFIGURE_LOCALLY}@postgres:5432/${POSTGRES_DB:-jormall_chatbot}
    ports:
      - "0.0.0.0:${APP_PORT:-3000}:8000"
    volumes:
      - production_local_conversations:/app/data/conversations
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

volumes:
  production_local_db:
  production_local_conversations:
