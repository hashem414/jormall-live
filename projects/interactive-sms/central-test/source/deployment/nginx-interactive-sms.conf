# Add this inside the existing HTTPS server block for jormallapp.com.
# Do not replace the existing server block or unrelated locations.

location = /interactive-sms {
    return 301 /interactive-sms/;
}

location /interactive-sms/ {
    proxy_pass http://127.0.0.1:<CHATBOT_HOST_PORT>;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /interactive-sms;

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
