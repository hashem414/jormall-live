<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كارماليت — مساعد العيادة</title>
<link rel="icon" href="/static/logo-mark.png">
<meta name="theme-color" content="#4d6160">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  /* ================================================================
     ثيم مشتق من شعار Karmalite:
       #4D6160  حبر الشعار (السليت الأخضر)  → اللون الأساسي
       #F3F5F4  خلفية بتلات اللوتس           → خلفية الصفحة
       #DFE1E0  حدود البتلات                 → الخطوط والفواصل
       #707473  رمادي "Medical Esthetic"     → النص الثانوي
     ================================================================ */
  :root{
    --brand:#4d6160; --brand-soft:#6b807e; --brand-pale:#97a19f;
    --bg:#f3f5f4; --panel:#ffffff; --ink:#283736; --muted:#707473;
    --line:#dfe1e0; --accent:#4d6160; --accent-2:#6b807e; --accent-ink:#fff;
    --bot-bg:#ffffff; --user-bg:linear-gradient(135deg,#4d6160,#3b4c4b);
    --field:#f3f5f4;
    --shadow:0 1px 2px rgba(40,55,54,.05), 0 8px 24px rgba(40,55,54,.07);
    --ok:#2f7d55; --ok-bg:rgba(47,125,85,.1); --ok-line:rgba(47,125,85,.25);
    --err:#b8524a; --err-bg:rgba(184,82,74,.1); --err-line:rgba(184,82,74,.25);
    --radius:18px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#101716; --panel:#18201f; --ink:#e6ecea; --muted:#8b9b99;
      --line:#283433; --accent:#9db3b0; --accent-2:#7d9591; --accent-ink:#101716;
      --bot-bg:#1f2928; --field:#101716;
      --user-bg:linear-gradient(135deg,#546967,#3d4f4e);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
      --ok:#63b585; --ok-bg:rgba(99,181,133,.12); --ok-line:rgba(99,181,133,.28);
      --err:#dd8079; --err-bg:rgba(221,128,121,.12); --err-line:rgba(221,128,121,.28);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI","Tahoma",system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%; max-width:760px; height:100dvh; max-height:100dvh;
    display:flex; flex-direction:column; background:var(--panel);
    box-shadow:var(--shadow); overflow:hidden; position:relative;
  }
  @media(min-width:820px){ .app{height:min(92dvh,880px); border-radius:24px; border:1px solid var(--line)} }

  /* ---------- Header ---------- */
  header{
    display:flex; flex-direction:column; gap:10px; padding:12px 16px;
    border-bottom:1px solid var(--line); background:var(--panel); z-index:2;
  }
  .brand{
    display:flex; align-items:center; gap:12px; width:100%;
  }
  .logo{
    width:42px;height:42px;border-radius:14px;flex:none;background:#fff;
    border:1px solid var(--line);background-image:url('/static/logo-mark.png');
    background-size:82%;background-position:center;background-repeat:no-repeat;
  }
  .who{flex:1;min-width:0}
  .who h1{font-size:15.5px;font-weight:650;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who p{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  .dot.off{background:var(--err)} .dot.wait{background:#d9a441}

  .actions{
    display:flex; align-items:center; gap:6px; width:100%; overflow-x:auto; padding-bottom:2px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .actions::-webkit-scrollbar{display:none}

  @media(min-width:640px){
    header{ flex-direction:row; justify-content:space-between; padding:14px 18px }
    .brand{ width:auto; flex:1; min-width:0 }
    .actions{ width:auto; flex:none; overflow-x:visible }
  }

  .ghost{
    background:none;border:1px solid var(--line);color:var(--muted);
    border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;
    white-space:nowrap;transition:.15s;flex:none;
  }
  .ghost:hover{color:var(--ink);border-color:var(--accent)}
  .cta{
    border:none;border-radius:11px;padding:9px 15px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:inherit;background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:var(--accent-ink);white-space:nowrap;transition:.15s;flex:none;
  }
  .cta:hover:not(:disabled){filter:brightness(1.07)}
  .cta:disabled{opacity:.5;cursor:not-allowed}

  /* ---------- Messages ---------- */
  main{flex:1;overflow-y:auto;padding:20px 18px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  main::-webkit-scrollbar{width:8px}
  main::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  .msg{max-width:82%;display:flex;flex-direction:column;gap:6px;animation:rise .25s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg.bot{align-self:flex-start}
  .msg.me{align-self:flex-end}
  /* سطر الرسالة: شعار العيادة جنب الفقاعة */
  .msg .line{display:flex;align-items:flex-end;gap:8px}
  .avatar{
    width:30px;height:30px;border-radius:10px;flex:none;background:#fff;
    border:1px solid var(--line);background-image:url('/static/logo-mark.png');
    background-size:78%;background-position:center;background-repeat:no-repeat;
    margin-bottom:2px;
  }
  /* زر الاستماع والمصادر بينحاذوا مع الفقاعة، مش مع الشعار */
  .msg.bot .speak,.msg.bot .sources{margin-inline-start:38px}
  .bubble{padding:12px 15px;border-radius:var(--radius);font-size:15px;line-height:1.75;white-space:pre-wrap;word-wrap:break-word}
  .bot .bubble{background:var(--bot-bg);border:1px solid var(--line);border-start-start-radius:6px}
  /* رقم قابل للاتصال داخل رد البوت */
  a.telnum{
    color:var(--accent);font-weight:700;text-decoration:none;white-space:nowrap;
    direction:ltr;unicode-bidi:embed;border-bottom:1px dashed var(--accent);
  }
  a.telnum:hover{border-bottom-style:solid}
  .me .bubble{background:var(--user-bg);color:#fff;border-start-end-radius:6px}
  .sources{font-size:11.5px;color:var(--muted);padding:0 4px}
  .sources summary{cursor:pointer;opacity:.75;list-style:none}
  .sources summary::-webkit-details-marker{display:none}
  .sources ul{margin:6px 0 0;padding-inline-start:14px;display:flex;flex-direction:column;gap:3px}
  .sources li{list-style:none;opacity:.85}
  .badge{
    align-self:flex-start;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;
    padding:7px 13px;border-radius:999px;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line);
  }
  .badge.alert{background:var(--err-bg);color:var(--err);border-color:var(--err-line)}

  /* بطاقة الموقع */
  .loc{
    align-self:flex-start;max-width:82%;background:var(--bot-bg);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px;
    animation:rise .25s ease;
  }
  .loc .head{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14px}
  .loc .pin{
    width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:15px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);
  }
  .loc .addr{font-size:14px;line-height:1.8;color:var(--ink)}
  .loc a{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);
    padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;transition:.15s;
  }
  .loc a:hover{filter:brightness(1.07)}

  /* ---------- Welcome ---------- */
  .welcome{text-align:center;padding:22px 10px 6px;color:var(--muted)}
  .welcome .mark{
    width:150px;height:138px;margin:0 auto 18px;border-radius:20px;background:#fff;
    border:1px solid var(--line);background-image:url('/static/logo.png');
    background-size:76%;background-position:center;background-repeat:no-repeat;
  }
  .welcome h2{color:var(--ink);font-size:18px;font-weight:650;margin-bottom:6px}
  .welcome p{font-size:14px;line-height:1.7;max-width:340px;margin:0 auto}
  .chip{
    background:none;border:1px solid var(--line);color:var(--ink);padding:9px 15px;
    border-radius:999px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}

  /* شريط الأسئلة السريعة — ظاهر دائماً فوق مربع الكتابة، بيمرّر أفقياً */
  .quickbar{
    display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;margin-bottom:2px;
    scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;
  }
  .quickbar::-webkit-scrollbar{display:none}
  .quickbar .chip{
    flex:0 0 auto;padding:7px 13px;font-size:12.5px;background:var(--field);white-space:nowrap;
  }

  .typing{display:flex;gap:4px;padding:15px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.3s infinite}
  .typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* ---------- Composer ---------- */
  footer{padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--panel)}
  .composer{display:flex;gap:9px;align-items:flex-end}
  textarea{
    flex:1;resize:none;font-family:inherit;font-size:15px;line-height:1.6;color:var(--ink);
    background:var(--field);border:1px solid var(--line);border-radius:16px;padding:12px 15px;
    max-height:130px;outline:none;transition:border-color .15s;
  }
  textarea:focus{border-color:var(--accent)}
  .send{
    width:44px;height:44px;flex:none;border:none;border-radius:14px;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);
    display:grid;place-items:center;transition:.15s;
  }
  .send:hover:not(:disabled){filter:brightness(1.07)}
  .send:disabled{opacity:.4;cursor:not-allowed}
  .send svg{width:19px;height:19px}
  html[dir="rtl"] .send svg{transform:scaleX(-1)}

  /* ---------- الصوت ---------- */
  .mic{
    width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:14px;cursor:pointer;
    background:var(--field);color:var(--muted);display:grid;place-items:center;transition:.15s;
  }
  .mic:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .mic:disabled{opacity:.4;cursor:not-allowed}
  .mic svg{width:19px;height:19px}
  .mic.rec{
    background:var(--err-bg);border-color:var(--err-line);color:var(--err);
    animation:pulse 1.3s ease-in-out infinite;
  }
  .mic.busy{opacity:.6;cursor:progress}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--err-line)}50%{box-shadow:0 0 0 6px transparent}}

  /* شريط حالة التسجيل فوق مربع الكتابة */
  .recbar{
    display:none;align-items:center;gap:9px;margin-bottom:8px;padding:8px 13px;
    border:1px solid var(--err-line);background:var(--err-bg);border-radius:12px;font-size:12.5px;color:var(--err);
  }
  .recbar.on{display:flex}
  .recbar .dot{width:8px;height:8px;border-radius:50%;background:var(--err);animation:pulse 1.3s infinite}
  .recbar .time{font-variant-numeric:tabular-nums;font-weight:600}
  .recbar button{
    margin-inline-start:auto;background:none;border:1px solid var(--err-line);
    color:var(--err);border-radius:999px;padding:3px 11px;font-size:11.5px;cursor:pointer;
  }

  /* زر تشغيل رد البوت */
  .speak{
    align-self:flex-start;margin-top:5px;background:none;border:1px solid var(--line);
    border-radius:999px;padding:4px 11px;font-size:11.5px;color:var(--muted);
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;
  }
  .speak:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .speak:disabled{opacity:.55;cursor:progress}
  .speak.playing{border-color:var(--accent);color:var(--accent)}
  .speak svg{width:13px;height:13px}
  .footbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
  .hint{font-size:11px;color:var(--muted);flex:1;line-height:1.5}
  .langswitch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
  .langswitch button{
    background:none;border:none;font-family:inherit;font-size:11.5px;font-weight:600;
    padding:6px 13px;cursor:pointer;color:var(--muted);transition:.15s;
  }
  .langswitch button.on{background:var(--accent);color:var(--accent-ink)}

  /* ---------- Booking modal ---------- */
  .overlay{
    position:absolute;inset:0;background:rgba(20,17,16,.5);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;padding:16px;z-index:10;
  }
  .overlay.open{display:flex;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{
    background:var(--panel);border-radius:22px;width:100%;max-width:440px;max-height:100%;
    overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .25s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .sheet header{border-bottom:1px solid var(--line);padding:16px 20px}
  .sheet header h2{font-size:16.5px;font-weight:650;flex:1}
  .sheet header p{font-size:12px;color:var(--muted);margin-top:3px}
  .sheet .body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:15px}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;color:var(--muted)}
  .field input,.field select,.field textarea{
    width:100%;font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--field);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none;transition:border-color .15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{min-height:64px;resize:vertical}
  .field.bad input,.field.bad select{border-color:var(--err)}
  .field .err{font-size:11.5px;color:var(--err);margin-top:5px;display:none}
  .field.bad .err{display:block}

  .cal{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--field)}
  .cal .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal .nav strong{font-size:13.5px;font-weight:650}
  .cal .nav button{
    background:none;border:1px solid var(--line);border-radius:9px;width:30px;height:30px;
    cursor:pointer;color:var(--ink);font-size:15px;line-height:1;display:grid;place-items:center;
  }
  .cal .nav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .cal .nav button:disabled{opacity:.3;cursor:not-allowed}
  .cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal .dow{font-size:10.5px;color:var(--muted);text-align:center;padding:5px 0;font-weight:600}
  .cal .day{
    aspect-ratio:1;border:none;background:none;border-radius:10px;cursor:pointer;
    font-family:inherit;font-size:13px;color:var(--ink);transition:.12s;
  }
  .cal .day:hover:not(:disabled){background:var(--line)}
  .cal .day:disabled{opacity:.25;cursor:not-allowed}
  .cal .day.sel{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);font-weight:700}
  .cal .day.today{box-shadow:inset 0 0 0 1px var(--accent)}
  .cal .blank{aspect-ratio:1}

  .note{font-size:11.5px;font-weight:700;color:var(--muted);line-height:1.6;background:var(--field);
        border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  /* بطاقات مواعيدي */
  .appt{
    border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--field);
    display:flex;flex-direction:column;gap:8px;
  }
  .appt .when{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
  .appt .svc{font-size:13px;color:var(--muted)}
  .appt .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .appt .st{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600}
  .appt .st.requested{background:rgba(191,150,60,.15);color:#8a6d1f}
  .appt .st.confirmed{background:var(--ok-bg);color:var(--ok)}
  @media (prefers-color-scheme:dark){ .appt .st.requested{color:#d9b45c} }
  .appt button{
    background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;
    padding:7px 14px;font-size:12.5px;font-family:inherit;cursor:pointer;transition:.15s;
  }
  .appt button:hover:not(:disabled){border-color:var(--err);color:var(--err)}
  .appt button:disabled{opacity:.45;cursor:not-allowed}
  .appt.gone{opacity:.6}
  .appt.gone .when{text-decoration:line-through}
  .appt button.go:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}

  /* اقتراحات الحجز البديل بعد الإلغاء */
  .rebook{
    border:1px solid var(--ok-line);background:var(--ok-bg);border-radius:14px;
    padding:13px 15px;display:flex;flex-direction:column;gap:10px;
  }
  .rebook .title{font-size:13px;font-weight:650;color:var(--ok)}
  .rebook .hint{font-size:12px;color:var(--muted);line-height:1.6}
  .slots{display:flex;flex-wrap:wrap;gap:7px}
  .slots button{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font-size:12.5px;font-family:inherit;cursor:pointer;color:var(--ink);
    transition:.15s;line-height:1.4;
  }
  .slots button:hover:not(:disabled){border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .slots button:disabled{opacity:.45;cursor:not-allowed}
  .slots button small{display:block;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo" role="img" aria-label="Karmalite"></div>
      <div class="who">
        <h1 data-i18n="clinic">عيادة كارماليت</h1>
        <p><span class="dot wait" id="dot"></span><span id="status">…</span></p>
      </div>
    </div>
    <div class="actions">
      <button class="ghost" id="openMine" data-i18n="myAppts">مواعيدي</button>
      <button class="ghost" id="openPwa" data-i18n="addToHomeScreen">📱 Add to Home Screen</button>
    </div>
  </header>

  <main id="feed">
    <div class="welcome" id="welcome">
      <div class="mark" role="img" aria-label="Karmalite Medical Esthetic"></div>
      <h2 data-i18n="welcomeTitle">أهلاً فيك في كارماليت</h2>
      <p data-i18n="welcomeText">أنا مساعد العيادة. اسألني عن الخدمات، الأسعار، أوقات الدوام، أو خليني أرتّبلك موعد.</p>
    </div>
  </main>

  <footer>
    <div class="quickbar" id="quickbar"></div>
    <div class="recbar" id="recbar">
      <span class="dot"></span>
      <span data-i18n="recording">جارِ التسجيل…</span>
      <span class="time" id="recTime">0:00</span>
      <button type="button" id="recCancel" data-i18n="recCancel">إلغاء</button>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" data-i18n-ph="placeholder" placeholder="اكتب رسالتك…"></textarea>
      <button class="mic" id="mic" hidden aria-label="mic">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M18 11a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-3.09A6 6 0 0 0 18 11z"/></svg>
      </button>
      <button class="send" id="send" disabled aria-label="send">

let lang = localStorage.getItem('karmalite_lang') || 'ar';

/* ==================== language ==================== */
function applyLang(){
  const t = T();
  document.documentElement.lang = t.htmlLang;
  document.documentElement.dir  = t.dir;
  document.title = t.title;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = t[el.dataset.i18n];
    if (typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t[el.dataset.i18nPh];
  });
  document.querySelectorAll('.langswitch button').forEach(b => {
    b.classList.toggle('on', b.dataset.lang === lang);
  });

  // شريط الأسئلة السريعة ظاهر دائماً — مش بشاشة الترحيب فقط
  const bar = $('quickbar');
  bar.innerHTML = '';
  t.chips.forEach(q => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = q;
    b.onclick = () => { send(q); bar.scrollTo({ left: 0 }); };
    bar.appendChild(b);
  });

  $('closeBooking').textContent = '✕';
  renderStatus();
  renderCalendar();
  renderMoveSub();               // نص «موعدك الحالي» بيتبدّل مع اللغة كمان
  if (selectedDate) loadSlots();
}

document.querySelectorAll('.langswitch button').forEach(b => {
  b.onclick = () => { lang = b.dataset.lang; localStorage.setItem('karmalite_lang', lang); applyLang(); };
});

/* ==================== health ==================== */
function renderStatus(){
  const dot = $('dot'), el = $('status'), t = T();
  if (!healthInfo)                    { dot.className='dot off'; el.textContent = t.noServer; }
  else if (healthInfo.database!=='ok'){ dot.className='dot off'; el.textContent = t.noDb; }
  else if (!healthInfo.chunks)        { dot.className='dot wait'; el.textContent = t.noKb; }
  else                                { dot.className='dot'; el.textContent = t.connected(healthInfo.chunks); }
}
/* الصوت بيظهر فقط لو السيرفر مفعّله والمتصفح بيدعم التسجيل */

// بنحتفظ بالوعد عشان استرجاع السجل ينتظره، وإلا الرسائل القديمة بتنعرض بدون زر الاستماع

    healthInfo = h;
    VOICE_ON = Boolean(h.voice);
    if (VOICE_ON && micSupported()) micBtn.hidden = false;
    renderStatus();
  })

/* ==================== chat ==================== */
const scroll = () => feed.scrollTop = feed.scrollHeight;

/* ---------- تحويل أرقام العيادة لروابط اتصال ---------- */
let CONTACT = { clinic_phone: '', emergency_phone: '' };
let phoneRe = null;

// نحتفظ بالوعد عشان استرجاع السجل ينتظره، وإلا الرسائل القديمة بتنعرض بدون روابط
const contactReady = fetch(API + '/contact').then(r => r.json())
  .then(c => { CONTACT = c; buildPhoneRegex(); })
  .catch(() => {});

function buildPhoneRegex(){
  // بنطابق أرقام العيادة فقط — مش أي رقم بالنص، حتى ما نحوّل سعراً أو تاريخاً لرابط.
  // كل رقم بيسمح بفواصل بينه (مسافة، شرطة، أقواس) لأن الموديل بيكتبها بصيغ مختلفة.
  const parts = [CONTACT.clinic_phone, CONTACT.emergency_phone]
    .filter(Boolean)
    .map(p => p.replace(/\D/g, ''))
    .filter(d => d.length >= 8)
    // \(? عشان يبلع القوس المفتوح كمان — بدونها بيطلع رقم الهاتف بقوس أعرج
    .map(d => '\\(?' + d.split('').join('[\\s\\-().‏]*'));
  phoneRe = parts.length ? new RegExp('(' + parts.join('|') + ')', 'g') : null;
}

function telHref(display){
  let d = display.replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g, '');
  if (d.startsWith('962')) return '+' + d;
  return '+962' + d.replace(/^0+/, '');
}

/* بنبني عقد DOM يدوياً — ممنوع innerHTML على مخرجات الموديل */
function withPhoneLinks(text){
  const frag = document.createDocumentFragment();
  if (!phoneRe){ frag.appendChild(document.createTextNode(text)); return frag; }

  phoneRe.lastIndex = 0;
  let last = 0, m;
  while ((m = phoneRe.exec(text)) !== null){
    if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    const a = document.createElement('a');
    a.className = 'telnum';
    a.href = telHref(m[0]);
    a.textContent = m[0];
    frag.appendChild(a);
    last = m.index + m[0].length;
  }
  if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

function botAvatar(){
  const av = document.createElement('div');
  av.className = 'avatar';
  av.setAttribute('role', 'img');
  av.setAttribute('aria-label', 'Karmalite');
  return av;
}

function addMessage(text, who){
  $('welcome')?.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + who;

  // الفقاعة داخل سطر عشان الشعار يوقف جنبها؛ زر الاستماع والمصادر
  // بيضلوا أبناء .msg فما بنحتاج نغيّر الدوال اللي بتضيفهم
  const line = document.createElement('div');
  line.className = 'line';
  if (who === 'bot') line.appendChild(botAvatar());

  const b = document.createElement('div');
  b.className = 'bubble';
  if (who === 'bot') b.appendChild(withPhoneLinks(text));
  else b.textContent = text;

  line.appendChild(b);
  wrap.appendChild(line);
  feed.appendChild(wrap); scroll();
  return wrap;
}
function addBadge(text, kind){
  const el = document.createElement('div');
  el.className = 'badge' + (kind ? ' ' + kind : '');

}

function addLocation(data){
  const t = T();
  const card = document.createElement('div');
  card.className = 'loc';

  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = '<div class="pin"><i class="fa-solid fa-location-dot"></i></div>';
  head.appendChild(document.createTextNode(t.locTitle));
  card.appendChild(head);

  const addr = document.createElement('div');
  addr.className = 'addr';
  addr.textContent = (lang === 'ar' ? data.address_ar : data.address_en) || data.address_ar;
  card.appendChild(addr);

  if (data.maps_url){
    const link = document.createElement('a');
    link.href = data.maps_url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.innerHTML = '<i class="fa-solid fa-map-location-dot"></i> ' + t.openMaps;
    card.appendChild(link);
  }

  feed.appendChild(card); scroll();
}
function addSources(wrap, sources){
  if (!sources?.length) return;
  const d = document.createElement('details'); d.className = 'sources';
  const s = document.createElement('summary'); s.textContent = T().sources(sources.length);
  d.appendChild(s);
  const ul = document.createElement('ul');
  sources.forEach(x => {
    const li = document.createElement('li');
    li.textContent = `${x.breadcrumb} · ${x.type} · ${x.score}`;
    ul.appendChild(li);
  });
  d.appendChild(ul); wrap.appendChild(d);
}
function showTyping(){

  w.className = 'msg bot';
  const line = document.createElement('div');

  const b = document.createElement('div');
  b.className = 'bubble';
  b.style.padding = '0';
  b.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';

async function send(text){
  if (busy) return;
  text = (text ?? input.value).trim();
  if (!text) return;

  busy = true; sendBtn.disabled = true;
  addMessage(text, 'me');
  input.value = ''; input.style.height = 'auto';
  const typing = showTyping();

  try{
    const res = await fetch(API + '/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message:text, session_id:sessionId, channel:'web', lang })
    });
    typing.remove();
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const wrap = addMessage(data.answer, 'bot');
    addSpeakButton(wrap, data.answer);
    addSources(wrap, data.sources);

    (data.tool_calls || []).forEach(call => {
      const r = call.result || {};
      if (call.name === 'capture_lead' && r.ok) addBadge(T().leadSaved);
      else if (call.name === 'book_appointment' && r.ok)
        addBadge(T().apptBadge(`${T().fmtDate(new Date(r.date))} · ${T().fmtTime(r.time)}`));
      else if (call.name === 'send_location' && r.ok) addLocation(r);
      else if (call.name === 'cancel_appointment' && r.ok)
        addBadge(T().apptCancelled(`${T().fmtDate(new Date(r.date))} · ${T().fmtTime(r.time)}`), 'alert');
      else if (call.name === 'escalate' && r.ok)
        addBadge(T()[r.level] || T().reception, r.level === 'emergency' ? 'alert' : '');
    });
  } catch(err){
    typing.remove();
    addMessage(T().netError + '\n(' + err.message + ')', 'bot');
  } finally {
    busy = false; sendBtn.disabled = !input.value.trim(); input.focus();
  }
}

input.oninput = () => {
  sendBtn.disabled = !input.value.trim() || busy;
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 130) + 'px';
};
input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } };
sendBtn.onclick = () => send();

/* ==================== الصوت: تسجيل ← نص ==================== */
/* التسجيل بيتحوّل لنص بالسيرفر وبينبعت كرسالة عادية على /chat —
   فما في مسار حجز موازي: نفس الأدوات ونفس الحواجز بالحالتين. */
let mediaRecorder = null, recChunks = [], recTimer = null, recStart = 0, recCancelled = false;
const micBtn = $('mic'), recBar = $('recbar');

const micSupported = () =>
  Boolean(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);

function pickMime(){
  // كل متصفح بيدعم صيغة مختلفة — بناخد أول وحدة مدعومة فعلاً
  const candidates = ['audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus','audio/mp4'];
  return candidates.find(m => MediaRecorder.isTypeSupported?.(m)) || '';
}

function recTick(){
  const s = Math.floor((Date.now() - recStart) / 1000);
  $('recTime').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2,'0')}`;
}

async function startRecording(){
  const t = T();
  if (!micSupported()) return addMessage(t.micUnsupported, 'bot');

  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  } catch {
    // رفض الإذن أو ما في مايك — نفرّقها عن فشل التحويل حتى المستخدم يعرف شو يعمل
    addMessage(t.micDenied, 'bot');
    return;
  }

  const mime = pickMime();
  mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  recChunks = []; recCancelled = false;
  mediaRecorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(tr => tr.stop());     // يطفّي مؤشر المايك بالمتصفح
    clearInterval(recTimer);
    recBar.classList.remove('on');
    micBtn.classList.remove('rec');
    if (recCancelled || !recChunks.length) return;
    await sendRecording(new Blob(recChunks, { type: mediaRecorder.mimeType || 'audio/webm' }));
  };

  mediaRecorder.start();
  recStart = Date.now(); recTick();
  recTimer = setInterval(recTick, 500);
  recBar.classList.add('on');
  micBtn.classList.add('rec');
}

function stopRecording(cancel = false){
  recCancelled = cancel;
  if (mediaRecorder?.state === 'recording') mediaRecorder.stop();
}

async function sendRecording(blob){
  const t = T();
  micBtn.classList.add('busy'); micBtn.disabled = true;
  const note = addMessage(t.recTranscribing, 'bot');
  try{
    const fd = new FormData();
    const ext = (blob.type.split('/')[1] || 'webm').split(';')[0];
    fd.append('audio', blob, `speech.${ext}`);
    fd.append('lang', lang);

    const res = await fetch(API + '/voice/transcribe', { method:'POST', body: fd });
    const data = await res.json().catch(() => ({}));
    note.remove();
    if (!res.ok) throw new Error(data.detail || 'HTTP ' + res.status);

    const text = (data.text || '').trim();
    if (!text){ addMessage(t.micEmpty, 'bot'); return; }
    await send(text);                 // بيمشي بنفس مسار الرسالة المكتوبة
  } catch(err){
    note.remove();
    addMessage(`${t.micFailed}\n(${err.message})`, 'bot');
  } finally {
    micBtn.classList.remove('busy'); micBtn.disabled = false;
  }
}

micBtn.onclick = () => {
  if (mediaRecorder?.state === 'recording') stopRecording(false);
  else startRecording();
};
$('recCancel').onclick = () => stopRecording(true);

/* ==================== الصوت: تشغيل رد البوت ==================== */
let currentAudio = null, currentSpeakBtn = null;

function stopPlayback(){
  if (currentAudio){ currentAudio.pause(); URL.revokeObjectURL(currentAudio.src); currentAudio = null; }
  if (currentSpeakBtn){
    currentSpeakBtn.classList.remove('playing');
    currentSpeakBtn.lastChild.textContent = T().speak;
    currentSpeakBtn = null;
  }
}

function addSpeakButton(wrap, text){
  if (!VOICE_ON || !text.trim()) return;
  const t = T();
  const btn = document.createElement('button');
  btn.className = 'speak';
  btn.type = 'button';
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>';
  btn.appendChild(document.createTextNode(t.speak));

  btn.onclick = async () => {
    if (currentSpeakBtn === btn){ stopPlayback(); return; }   // ضغطة تانية = إيقاف
    stopPlayback();                                            // صوت واحد بس بنفس الوقت
    btn.disabled = true; btn.lastChild.textContent = t.speakLoading;
    try{
      const res = await fetch(API + '/voice/speak', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ text, lang })
      });
      if (!res.ok){
        const d = await res.json().catch(() => ({}));
        throw new Error(d.detail || 'HTTP ' + res.status);
      }
      const url = URL.createObjectURL(await res.blob());
      currentAudio = new Audio(url);
      currentSpeakBtn = btn;
      btn.classList.add('playing'); btn.lastChild.textContent = t.speakStop;
      currentAudio.onended = stopPlayback;
      currentAudio.onerror = stopPlayback;
      await currentAudio.play();
    } catch(err){
      addMessage(`${t.speakFailed}\n(${err.message})`, 'bot');
      stopPlayback();
    } finally {
      btn.disabled = false;
      if (currentSpeakBtn !== btn) btn.lastChild.textContent = t.speak;
    }
  };
  wrap.appendChild(btn);
}

/* ==================== calendar (نقل المواعيد فقط) ==================== */
const MAX_AHEAD = 60;
let viewYear, viewMonth, selectedDate = null;
const today = new Date(); today.setHours(0,0,0,0);
const maxDate = new Date(today); maxDate.setDate(maxDate.getDate() + MAX_AHEAD);
viewYear = today.getFullYear(); viewMonth = today.getMonth();

const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const isFriday = d => d.getDay() === 5;

function renderCalendar(){
  const t = T();
  $('monthLabel').textContent = `${t.months[viewMonth]} ${viewYear}`;
  $('dows').innerHTML = t.dows.map(d => `<div class="dow">${d}</div>`).join('');

  const first = new Date(viewYear, viewMonth, 1);
  const total = new Date(viewYear, viewMonth + 1, 0).getDate();
  const grid = $('days');
  grid.innerHTML = '';
  for (let i = 0; i < first.getDay(); i++) grid.insertAdjacentHTML('beforeend','<div class="blank"></div>');

  for (let day = 1; day <= total; day++){
    const d = new Date(viewYear, viewMonth, day);
    const btn = document.createElement('button');
    btn.className = 'day';
    btn.textContent = day;
    btn.disabled = d < today || d > maxDate || isFriday(d);
    if (isFriday(d)) btn.title = t.fridayClosed;
    if (+d === +today) btn.classList.add('today');
    if (selectedDate && iso(d) === iso(selectedDate)) btn.classList.add('sel');
    btn.onclick = () => { selectedDate = d; $('dateField').classList.remove('bad'); renderCalendar(); loadSlots(); };
    grid.appendChild(btn);
  }

  $('prevM').disabled = viewYear === today.getFullYear() && viewMonth === today.getMonth();
  $('nextM').disabled = new Date(viewYear, viewMonth + 1, 1) > maxDate;
}
$('prevM').onclick = () => { if (--viewMonth < 0){ viewMonth = 11; viewYear--; } renderCalendar(); };
$('nextM').onclick = () => { if (++viewMonth > 11){ viewMonth = 0; viewYear++; } renderCalendar(); };

async function loadSlots(){
  const sel = $('fTime'), t = T();
  if (!selectedDate) return;
  const previous = sel.value;      // نحافظ على اختيار المستخدم عند تبديل اللغة أو إعادة التحميل
  sel.disabled = true;
  sel.innerHTML = `<option>${t.loadingSlots}</option>`;
  $('slotsRetry')?.remove();

  // مهلة صريحة: بدونها الطلب بيضل معلّق للأبد لو السيرفر وقع،
  // والقائمة بتظل عالقة على "جارِ تحميل الأوقات…" بدون ما يعرف المستخدم شو صار.
  const abort = new AbortController();
  const timer = setTimeout(() => abort.abort(), 12000);

  try{
    // الخانة بتستوعب خدمات مختلفة بنفس الوقت، فالتوفر بيعتمد على خدمة هذا
    // الموعد بالذات — بدونها بتظهر أوقات محجوزة لنفس الخدمة كأنها متاحة.
    const gender = rescheduleTarget?.gender || 'unknown';
    const params = new URLSearchParams({ date: iso(selectedDate), gender });
    if (rescheduleTarget?.service) params.set('service', rescheduleTarget.service);
    if (minePhone) params.set('phone', minePhone);   // الرقم اللي تحقّق فيه بشاشة «مواعيدي»
    const res = await fetch(`${API}/availability?${params}`, { signal: abort.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    if (!data.slots?.length){
      sel.innerHTML = `<option value="">${data.reason === 'friday_closed' ? t.fridayClosed : t.noSlots}</option>`;
      return;
    }
    sel.innerHTML = `<option value="">${t.chooseTime}</option>` +
      data.slots.map(s => `<option value="${s}">${t.fmtTime(s)}</option>`).join('');
    if (previous && data.slots.includes(previous)) sel.value = previous;
    sel.disabled = false;
  } catch {
    // خطأ شبكة ≠ يوم ممتلئ. لازم نفرّقهم وإلا المستخدم بيظن إنه ما في مواعيد أصلاً.
    sel.innerHTML = `<option value="">${t.slotsFailed}</option>`;
    const retry = document.createElement('button');
    retry.id = 'slotsRetry';
    retry.type = 'button';
    retry.className = 'ghost';
    retry.style.cssText = 'margin-top:8px;width:100%;padding:9px';
    retry.textContent = t.retry;
    retry.onclick = loadSlots;
    $('timeField').appendChild(retry);
  } finally {
    clearTimeout(timer);
  }
}
$('fTime').onchange = () => $('timeField').classList.remove('bad');

function getMobileOS() {
  const ua = navigator.userAgent || navigator.vendor || window.opera;
  if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
    return 'ios';
  }
  if (/android/i.test(ua)) {
    return 'android';
  }
  return 'desktop';
}

  const msgEl = $('pwaMessage');

    empty.textContent = t.mineEmpty;

  list.forEach(a => {

      `<div class="when">${when}</div>

      btn.disabled = true; move.disabled = true; btn.textContent = t.cancelling;
      try{
        const res = await fetch(API + '/appointments/cancel', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ full_name:mineName, phone:minePhone, reference:a.reference, lang })
        });

        btn.disabled = false; move.disabled = false; btn.textContent = t.cancelBtn;
        alert(e.message);
      }
    };
    foot.appendChild(btn);
    body.appendChild(card);
  });

  const back = document.createElement('button');
  back.className = 'ghost';
  back.style.cssText = 'width:100%;padding:11px';
  back.textContent = t.backToForm;
  back.onclick = mineForm;
  body.appendChild(back);
}

/* ---------- اقتراح مواعيد بديلة بعد الإلغاء ---------- */
async function showRebook(afterCard, cancelled){
  const t = T();
  const panel = document.createElement('div');
  panel.className = 'rebook';
  panel.innerHTML = `<div class="title">${t.rebookTitle}</div>
                     <div class="hint">${t.rebookHint}</div>`;
  afterCard.insertAdjacentElement('afterend', panel);

  const row = document.createElement('div');
  row.className = 'slots';
  panel.appendChild(row);

  let slots = [];
  try{
    const res = await fetch(`${API}/next-slots?gender=${cancelled.gender || 'unknown'}&limit=6`);
    slots = (await res.json()).slots || [];
  } catch { /* بنكمل بزر «اختر وقت آخر» */ }

  if (!slots.length){
    const none = document.createElement('div');
    none.className = 'hint';
    none.textContent = t.noNearby;
    row.appendChild(none);
  }

  slots.forEach(s => {
    const btn = document.createElement('button');
    btn.innerHTML = `${t.fmtTime(s.time)}<small>${t.fmtDate(new Date(s.date))}</small>`;
    btn.onclick = async () => {
      [...row.children].forEach(b => b.disabled = true);
      btn.textContent = t.booking;
      try{
        const res = await fetch(API + '/appointments', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            full_name: mineName, phone: minePhone, date: s.date, time: s.time,
            service: cancelled.service || null, gender: cancelled.gender || 'unknown',
            session_id: sessionId, lang
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'HTTP ' + res.status);
        const when = `${t.fmtDate(new Date(s.date))} · ${t.fmtTime(s.time)}`;
        panel.innerHTML = `<div class="title">✓ ${t.rebookDone(when)}</div>
                           <div class="hint">${t.doneText}</div>`;
        addBadge(t.apptBadge(when));
      } catch(e){
        alert(e.message);
        [...row.children].forEach(b => b.disabled = false);
        btn.innerHTML = `${t.fmtTime(s.time)}<small>${t.fmtDate(new Date(s.date))}</small>`;
      }
    };
    row.appendChild(btn);
  });

  // ما في نموذج حجز — الأوقات خارج هالقائمة بيرتّبها المساعد بالشات
  const other = document.createElement('button');
  other.className = 'ghost';
  other.style.cssText = 'width:100%;padding:10px';
  other.textContent = t.otherTime;
  other.onclick = () => {
    mineOverlay.classList.remove('open');
    send(t.rebookAsk);
  };
  panel.appendChild(other);
}

/* ---------- وضع نقل الموعد ---------- */
let rescheduleTarget = null;      // الموعد المطلوب نقله، أو null والتقويم مسكّر

function renderMoveSub(){
  const a = rescheduleTarget;
  if (!a) return;
  const t = T();
  $('moveSub').textContent = t.moveSub(`${t.fmtDate(new Date(a.date))} · ${t.fmtTime(a.time)}`);
}

function startReschedule(appointment){
  rescheduleTarget = appointment;
  selectedDate = null;                       // ما بنورّث تاريخ من نقل سابق
  $('fTime').innerHTML = ''; $('fTime').disabled = true;
  $('formError').style.display = 'none';
  $('dateField').classList.remove('bad');
  $('timeField').classList.remove('bad');
  renderMoveSub();
  overlay.classList.add('open');
  renderCalendar();
}

function clearReschedule(){
  rescheduleTarget = null;
}

$('lookupBtn').onclick = lookup;
$('mPhone').onkeydown = e => { if (e.key === 'Enter') lookup(); };

/* ==================== init ==================== */
applyLang();
restoreHistory();
input.focus();
</script>
