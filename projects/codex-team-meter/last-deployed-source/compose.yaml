name: codex-team-meter

services:
  meter:
    build: .
    restart: unless-stopped
    init: true
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Run node deploy/setup.mjs first}
      PUBLIC_URL: ${PUBLIC_URL:?Set your HTTPS domain}
      DATA_DIR: /app/data
      PORT: 8790
    ports:
      - "127.0.0.1:8790:8790"
    mem_limit: 128m
    memswap_limit: 160m
    cpus: 0.25
    pids_limit: 64
    volumes:
      - meter-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"
volumes:
  meter-data:
