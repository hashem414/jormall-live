}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name main-site.jormallapp.com;
    ssl_certificate /etc/letsencrypt/live/main-site.jormallapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/main-site.jormallapp.com/privkey.pem;
    location ~ /\.(?:env|git) { deny all; }
    # Same-origin SSO endpoints for the main-site subdomain.
    location = /auth/login {
        proxy_pass http://127.0.0.1:18100/login;
        proxy_set_header Host assistant.jormallapp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }
    location = /auth/status {
        proxy_pass http://127.0.0.1:18100/sso/verify;
        proxy_set_header Host assistant.jormallapp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }
    location = /auth/logout {
        proxy_pass http://127.0.0.1:18100/logout;
        proxy_set_header Host assistant.jormallapp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store" always;
    }
    location / {
        proxy_pass http://127.0.0.1:18005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
