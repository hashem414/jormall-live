# Generated by jormall-runner. Do not edit.
server {
    listen 80;
    listen [::]:80;
    server_name assistant.jormallapp.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name assistant.jormallapp.com;
    ssl_certificate /etc/letsencrypt/live/assistant.jormallapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assistant.jormallapp.com/privkey.pem;
    location ~ /\.(?:env|git) { deny all; }
    location = /_sso_verify {
        internal;
        # A missing/expired session must reach auth_request as 401 so the
        # outer request can redirect cleanly to the central sign-in page.
        proxy_intercept_errors off;
        proxy_pass http://127.0.0.1:18100/sso/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }
    error_page 401 = @sso_login;
    location @sso_login {
        return 302 https://jormallapp.com/?login=1&next=https://$host$request_uri;
    }
    # The Assistant UI may be stopped from Deployer without stopping SSO.
    proxy_intercept_errors on;
    error_page 502 503 504 =503 /assistant-offline.html;
    location = /assistant-offline.html {
        internal;
        root /var/www/jormall-offline;
        add_header Cache-Control "no-store" always;
    }
    # This UI is also served below a legacy prefix on the main site.
    # Keep its absolute URLs working when the same build is opened on this subdomain.
    location = /jormall-assistant {
        return 301 /jormall-assistant/;
    }
    location ^~ /jormall-assistant/ {
        auth_request /_sso_verify;
        auth_request_set $sso_user $upstream_http_x_sso_user;
        rewrite ^/jormall-assistant/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /jormall-assistant;
        proxy_set_header X-Authenticated-User $sso_user;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
    location / {
        auth_request /_sso_verify;
        auth_request_set $sso_user $upstream_http_x_sso_user;
        proxy_pass http://127.0.0.1:18016;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Authenticated-User $sso_user;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
