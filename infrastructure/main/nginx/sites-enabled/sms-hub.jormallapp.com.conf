server {
    server_name sms-hub.jormallapp.com;

    root /var/www/frontend;
    index index.html;

    location ~ /\.(?:env|git) {
        deny all;
    }

    location = /_sso_verify {
        internal;
        proxy_pass http://127.0.0.1:18100/sso/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    error_page 401 = @sso_login;

    location @sso_login {
        return 302 https://jormallapp.com/?login=1&next=https://$host$request_uri;
    }

    # Browsers fetch PWA metadata without the application's SSO credentials.
    # These files contain no private data and must not redirect to the login page.
    location = /manifest.json {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /icons/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        auth_request /_sso_verify;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sms-hub.jormallapp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sms-hub.jormallapp.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = sms-hub.jormallapp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name sms-hub.jormallapp.com;
    return 404; # managed by Certbot


}
