server {
    listen 80;
    server_name jormallapp.com www.jormallapp.com;
    return 301 https://jormallapp.com$request_uri;
}

server {
   

     
   location = /corolla2026-chatbot {
    return 301 /corolla2026-chatbot/;
}

location ^~ /corolla2026-chatbot/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /corolla2026-chatbot;

    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_cache off;

    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jormallapp.com www.jormallapp.com;

    location = /campaign-test {
        return 301 /campaign-test/;
    }

    location ^~ /campaign-test/ {
        proxy_pass http://172.26.15.40:18302;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /campaign-test;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    include /etc/nginx/snippets/interactive-sms-review.conf;
    include /etc/nginx/snippets/toyota-rav4-knowledge-contract-qa.conf;

    root /var/www/frontend;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/jormallapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jormallapp.com/privkey.pem;

    # Central JorMall sign-in endpoints. The auth backend is loopback-only.
    location = /auth/login {
        proxy_pass http://127.0.0.1:18100/login;
        proxy_pass_request_headers on;
        proxy_set_header Host assistant.jormallapp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "no-store" always;
    }
    location = /auth/status {
        proxy_pass http://127.0.0.1:18100/sso/verify;
        proxy_set_header Host assistant.jormallapp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "no-store" always;
    }
    location = /auth/logout {
        proxy_pass http://127.0.0.1:18100/logout;
        proxy_set_header Host assistant.jormallapp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        add_header Cache-Control "no-store" always;
    }
    location = /_sso_verify {
        internal;
        proxy_pass http://127.0.0.1:18100/sso/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }
    location = /_sso_verify_admin {
        internal;
        proxy_pass http://127.0.0.1:18100/sso/verify-admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }
    error_page 401 = @sso_login;
    location @sso_login {
        return 302 https://jormallapp.com/?login=1&next=https://$host$request_uri;
    }
    location ^~ /admin/ {
        auth_request /_sso_verify_admin;
        auth_request_set $sso_user $upstream_http_x_sso_user;
        proxy_pass http://127.0.0.1:18016;
        proxy_http_version 1.1;
        proxy_set_header Host assistant.jormallapp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Authenticated-User $sso_user;
        client_max_body_size 128k;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html { }

        
    location /spin-win-test-2026/ {
        alias /var/www/frontend/spin-win-test-2026/;
        index index.html;
        try_files $uri $uri/ /spin-win-test-2026/index.html;
    }

    location /spin-win-test2-2026/ {
        try_files $uri $uri/ /spin-win-test2-2026/index.html;
    }

    location /pdfs/ {
        alias /var/www/frontend/pdfs/;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }
    # Redirect the route without a trailing slash
    location = /jormall-assistant {
        return 301 https://assistant.jormallapp.com/$is_args$args;
    }
    location = /jormall-assistant/ {
        return 301 https://assistant.jormallapp.com/$is_args$args;
    }

    # JorMall Assistant Flask application
    location ^~ /jormall-assistant/ {
        return 301 https://assistant.jormallapp.com$request_uri;
    }
    # Generated JorMall Assistant documents
    location ^~ /exports/ {
        auth_request /_sso_verify;
        proxy_pass http://127.0.0.1:18005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }

    # Flask static resources referenced by absolute /static URLs
    location ^~ /static/ {
        proxy_pass http://127.0.0.1:18005;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application favicon
    location = /favicon.ico {
        proxy_pass http://127.0.0.1:18005/favicon.ico;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # JorMall Platform Assistant FastAPI application
    location = /platform-assistant {
        return 301 https://platform-assistant.jormallapp.com/$is_args$args;
    }
    location = /platform-assistant/ {
        return 301 https://platform-assistant.jormallapp.com/$is_args$args;
    }

    location ^~ /platform-assistant/ {
        return 301 https://platform-assistant.jormallapp.com$request_uri;
    }
location = /sms-service-chatbot {
    proxy_pass http://127.0.0.1:3002;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /sms-service-chatbot;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Accel-Buffering no;
    proxy_redirect off;
}

location ^~ /sms-service-chatbot/ {
    proxy_pass http://127.0.0.1:3002;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /sms-service-chatbot;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    add_header X-Accel-Buffering no;
    proxy_redirect off;
}
# ============================================================
# SMA AI Backend API
# ============================================================

location = /sma-extension {
    return 301 https://sma-extension.jormallapp.com/$is_args$args;
}
location = /sma-extension/ {
    return 301 https://sma-extension.jormallapp.com/$is_args$args;
}

location /sma-extension/ {
    proxy_pass http://127.0.0.1:18007;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /sma-extension;
    proxy_set_header X-SMA-Extension-Key $http_x_sma_extension_key;

    proxy_connect_timeout 15s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    client_max_body_size 5m;
    add_header Cache-Control "no-store" always;
}
   


 location = /interactive-sms {
    return 301 /interactive-sms/;
}

location /interactive-sms/ {
    proxy_pass http://127.0.0.1:18035;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /interactive-sms;

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
} 

# Centrally hosted UI loaded by the internal SMA Chrome extension.
location = /sma/extension {
    return 301 /sma/extension/;
}

location ^~ /sma/extension/ {
    alias /var/www/sma-extension/;
    index index.html;
    autoindex off;
    try_files $uri $uri/ =404;

    add_header Content-Security-Policy "frame-ancestors 'self' http://sma:* https://sma:* http://192.168.192.52:* https://192.168.192.52:* http://192.168.192.160:* https://192.168.192.160:*;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

# Isolated SMA test UI. Production remains at /sma/extension/.
location = /sma/extension-test {
    return 301 /sma/extension-test/;
}
location ^~ /sma/extension-test/ {
    alias /opt/jormall/staging/sma-extension-test/releases/20261028-gpt6-luna-zero-delivery/hosted-app/;
    index index.html;
    autoindex off;
    try_files $uri $uri/ =404;

    add_header Content-Security-Policy "frame-ancestors 'self' http://sma:* https://sma:* http://192.168.192.52:* https://192.168.192.52:* http://192.168.192.160:* https://192.168.192.160:*;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

# Isolated CSV export test UI. Existing production and test UIs remain unchanged.
location = /sma/extension-csv-test {
    return 301 /sma/extension-csv-test/;
}
location ^~ /sma/extension-csv-test/ {
    proxy_pass http://127.0.0.1:18032/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;

    add_header Content-Security-Policy "frame-ancestors 'self' http://sma:* https://sma:* http://192.168.192.52:* https://192.168.192.52:* http://192.168.192.160:* https://192.168.192.160:*;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

# Innovation is now the main Docker-served site; preserve legacy URLs.
location = /innovation {
    return 301 https://main-site.jormallapp.com/$is_args$args;
}
location = /innovation/ {
    return 301 https://main-site.jormallapp.com/$is_args$args;
}
location ^~ /innovation/ {
    rewrite ^/innovation/?(.*)$ /$1 permanent;
}
location / {
    # Stable loopback gateway; the deployer switches its upstream atomically.
    proxy_pass http://127.0.0.1:18102;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

}
