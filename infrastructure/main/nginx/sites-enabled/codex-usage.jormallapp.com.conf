server {
    listen 80;
    listen [::]:80;
    server_name codex-usage.jormallapp.com;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/codex-usage-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name codex-usage.jormallapp.com;

    ssl_certificate /etc/letsencrypt/live/codex-usage.jormallapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codex-usage.jormallapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 200k;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
    }
}
