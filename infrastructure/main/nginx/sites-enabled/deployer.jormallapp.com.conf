# JorMall Deployer bootstrap route. TLS is added after DNS resolves here.
server {
    server_name deployer.jormallapp.com;
    server_tokens off;
    location ~ /\.(?:env|git) { deny all; }
    location = /_sso_verify_admin {
        internal;
        proxy_pass http://127.0.0.1:18100/sso/verify-admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }
    error_page 401 = @sso_login;
    location @sso_login {
        return 302 https://jormallapp.com/?login=1&next=https://$host$request_uri;
    }
    location / {
        auth_request /_sso_verify_admin;
        auth_request_set $sso_user $upstream_http_x_sso_user;
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Authenticated-User $sso_user;
        proxy_read_timeout 920s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/deployer.jormallapp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/deployer.jormallapp.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = deployer.jormallapp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name deployer.jormallapp.com;
    return 404; # managed by Certbot


}
