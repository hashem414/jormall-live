 server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.jormallapp.com;

    ssl_certificate     /etc/letsencrypt/live/jormallapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jormallapp.com/privkey.pem;

    location /api/ {

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $jormall_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $jormall_cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Vary "Origin" always;
            return 204;
        }

        proxy_pass http://127.0.0.1:18002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /spin/ {

    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin $jormall_cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary "Origin" always;

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $jormall_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;
        return 204;
    }

    rewrite ^/spin/(.*)$ /api/spin/$1 break;

    proxy_pass http://127.0.0.1:18006;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

    location / {
        return 404;
    }
   
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
     }    
    location ~* \.(env|ini|log|conf)$ {
      deny all;
    }
}
