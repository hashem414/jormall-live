# Add inside the HTTPS server block for interactive-sms-test.jormallapp.com.
# This location is isolated from the existing /interactive-sms/ deployment.
location = /gemini-tts {
    return 301 /gemini-tts/;
}

location = /gemini-tts/health {
    proxy_pass http://127.0.0.1:18033/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /gemini-tts/db-health {
    proxy_pass http://127.0.0.1:18033/db-health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /gemini-tts/ {
    proxy_pass http://127.0.0.1:18033;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /gemini-tts;

    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
