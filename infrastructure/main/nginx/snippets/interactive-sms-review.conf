# Independent pre-repair JorMall SMS copy; original /interactive-sms/ is preserved.
location = /interactive-sms-review {
    return 308 /interactive-sms-review/$is_args$args;
}
location ^~ /interactive-sms-review/ {
    proxy_pass https://100-61-125-129.sslip.io;
    proxy_ssl_server_name on;
    proxy_ssl_name 100-61-125-129.sslip.io;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /interactive-sms-review;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    client_max_body_size 10m;
}
