location = /toyota-rav4-knowledge-contract-qa {
    return 301 /toyota-rav4-knowledge-contract-qa/;
}
location ^~ /toyota-rav4-knowledge-contract-qa/ {
    proxy_pass https://100.61.125.129;
    proxy_ssl_server_name on;
    proxy_ssl_name 100-61-125-129.sslip.io;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /toyota-rav4-knowledge-contract-qa;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 15s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_max_body_size 20m;
}
