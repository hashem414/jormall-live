name: interactive-sms-gemini-tts

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jormall_gemini_tts}
      POSTGRES_USER: ${POSTGRES_USER:-jormall_gemini_tts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - /var/lib/jormall/apps/interactive-sms-gemini-tts/db:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U ${POSTGRES_USER:-jormall_gemini_tts}
          -d ${POSTGRES_DB:-jormall_gemini_tts}
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  chatbot:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - /etc/jormall/apps/interactive-sms-gemini-tts/app.env
    environment:
      APP_HOST: 0.0.0.0
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-application-default-credentials.json
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-jormall_gemini_tts}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jormall_gemini_tts}
    ports:
      - "127.0.0.1:18033:8000"
    volumes:
      - /var/lib/jormall/apps/interactive-sms-gemini-tts/conversations:/app/data/conversations
      - /etc/jormall/apps/interactive-sms-gemini-tts/google-adc.json:/run/secrets/google-application-default-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
