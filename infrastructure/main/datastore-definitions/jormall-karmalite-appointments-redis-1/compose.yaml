name: jormall-karmalite-appointments

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 256M
    logging: &logging
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - redis_data:/data
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 96M
    logging: *logging

  web:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:18201:3000"
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 640M
    logging: *logging

  worker:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    command: ["pnpm", "--dir", "/app/apps/worker", "exec", "tsx", "src/main.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
