name: jormall-appointments-v2
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_DB: jormall_preview
      POSTGRES_USER: jormall_v2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jormall_v2 -d jormall_preview"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    mem_limit: 96m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "48mb", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?required}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  web:
    image: jormall-appointments-v2:20260906-slim
    restart: unless-stopped
    init: true
    mem_limit: 512m
    env_file: .env
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    ports:
      - "127.0.0.1:18200:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ar/login').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      start_period: 45s
      retries: 5
    logging: *logging
  worker:
    image: jormall-appointments-v2:20260906-slim
    restart: unless-stopped
    init: true
    mem_limit: 256m
    working_dir: /worker/apps/worker
    command: ["node", "--import", "tsx", "src/main.ts"]
    env_file: .env
    environment:
      NODE_OPTIONS: --max-old-space-size=192
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging
volumes:
  postgres-data:
  redis-data:
